$kind: collection
name: Workflow Tests
auth:
  - id: f04c5594-f276-4ae3-9a58-28bd58bc9d61
    type: jwt
    name: jwt auth
    credentials:
      algorithm: HS256
      secret: "{{jwtSecret}}"
      isSecretBase64Encoded: true
      addTokenTo: header
      payload: "{}"
      queryParamKey: token
      header: "{}"
      headerPrefix: Bearer
order: 1000
